##############################################################################
# SoftAtHome Gateway - Installed Dashboard (tailored to your HGW5 setup)
##############################################################################

title: Livebox
path: livebox
type: sections
sections:

  # --------------------------------------------------------------------------
  # Section 1: Network Status Overview
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Status
    cards:
      - type: tile
        entity: binary_sensor.hgw5_wan_status
        name: WAN
        color: green

      - type: tile
        entity: binary_sensor.hgw5_remote_access
        name: Remote Access
        color: red

      - type: tile
        entity: button.hgw5_livebox_restart
        name: Restart
        color: red
        tap_action:
          action: toggle
          confirmation:
            text: Are you sure you want to restart the Livebox?

  # --------------------------------------------------------------------------
  # Section 2: WiFi Controls
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi Controls
    cards:
      - type: tile
        entity: switch.hgw5_wifi
        name: WiFi
        color: blue

      - type: tile
        entity: switch.hgw5_guest_wifi
        name: Guest WiFi
        color: purple

      - type: tile
        entity: switch.hgw5_wps
        name: WPS
        color: amber

  # --------------------------------------------------------------------------
  # Section 3: Action Buttons
  # --------------------------------------------------------------------------
  - type: grid
    title: Actions
    columns: 3
    cards:
      - type: button
        name: WiFi On
        icon: mdi:wifi
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_wifi

      - type: button
        name: WiFi Off
        icon: mdi:wifi-off
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_wifi
          confirmation:
            text: "Disable WiFi?"

      - type: button
        name: Guest WiFi On
        icon: mdi:wifi-lock-open
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_guest_wifi

      - type: button
        name: Guest WiFi Off
        icon: mdi:wifi-lock
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_guest_wifi
          confirmation:
            text: "Disable Guest WiFi?"

      - type: button
        name: All WiFi Off
        icon: mdi:wifi-cancel
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi
          confirmation:
            text: "Disable ALL WiFi networks?"

      - type: button
        name: All WiFi On
        icon: mdi:wifi-check
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi

      - type: button
        name: Add Static DHCP
        icon: mdi:ip-network
        tap_action:
          action: perform-action
          perform_action: livebox.add_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            ip_address: "192.168.1.100"
          confirmation:
            text: "Add static DHCP lease?"

      - type: button
        name: Remove Static DHCP
        icon: mdi:ip-network-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
          confirmation:
            text: "Remove static DHCP lease?"

      - type: button
        name: Add Port Forward
        icon: mdi:arrow-right-bold-box
        tap_action:
          action: perform-action
          perform_action: livebox.add_port_forwarding
          data:
            description: "Web Server"
            destination_ip_address: "192.168.1.100"
            internal_port: 8080
            external_port: 80
            protocol: tcp
            enable: true
          confirmation:
            text: "Add port forwarding rule?"

      - type: button
        name: Remove Port Forward
        icon: mdi:arrow-right-bold-box-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_port_forwarding
          data:
            id: "Web Server"
            destination_ip_address: "192.168.1.100"
          confirmation:
            text: "Remove port forwarding rule?"

      - type: button
        name: Rename Device
        icon: mdi:rename
        tap_action:
          action: perform-action
          perform_action: livebox.rename_device
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            name: "Living Room TV"
          confirmation:
            text: "Rename this device?"

      - type: button
        name: Clear Missed Calls
        icon: mdi:phone-missed
        tap_action:
          action: perform-action
          perform_action: livebox.remove_call_missed
          confirmation:
            text: "Clear all missed calls?"

  # --------------------------------------------------------------------------
  # Section 4: Connection Speed
  # --------------------------------------------------------------------------
  - type: grid
    title: Connection Speed
    cards:
      - type: gauge
        entity: sensor.hgw5_xdsl_download
        name: Download
        min: 0
        max: 1000
        severity:
          green: 100
          yellow: 30
          red: 0
        needle: true

      - type: gauge
        entity: sensor.hgw5_xdsl_upload
        name: Upload
        min: 0
        max: 300
        severity:
          green: 30
          yellow: 10
          red: 0
        needle: true

  # --------------------------------------------------------------------------
  # Section 5: Fiber Signal
  # --------------------------------------------------------------------------
  - type: grid
    title: Fiber Signal
    cards:
      - type: gauge
        entity: sensor.hgw5_fiber_power_rx
        name: Fiber RX Power
        unit: dBm
        min: -30
        max: 0
        severity:
          green: -20
          yellow: -25
          red: -30
        needle: true

      - type: gauge
        entity: sensor.hgw5_fiber_power_tx
        name: Fiber TX Power
        unit: dBm
        min: -10
        max: 10
        severity:
          green: 0
          yellow: -5
          red: -10
        needle: true

  # --------------------------------------------------------------------------
  # Section 6: Traffic History
  # --------------------------------------------------------------------------
  - type: grid
    title: Traffic
    cards:
      - type: statistics-graph
        entities:
          - entity: sensor.hgw5_fiber_rx
            name: Download
          - entity: sensor.hgw5_fiber_tx
            name: Upload
        days_to_show: 7
        stat_types:
          - change
        chart_type: bar
        period: day
        title: Daily Traffic

  # --------------------------------------------------------------------------
  # Section 7: Phone & Calls
  # --------------------------------------------------------------------------
  - type: grid
    title: Phone
    cards:
      - type: tile
        entity: binary_sensor.hgw5_call_missed
        name: Missed Calls
        color: red

      - type: tile
        entity: button.hgw5_ring_your_phone
        name: Ring Phone

      - type: tile
        entity: button.hgw5_clear_calls
        name: Clear Calls

      - type: calendar
        entities:
          - entity: calendar.hgw5_call_log
        initial_view: listWeek
        title: Call Log

  # --------------------------------------------------------------------------
  # Section 8: Network Details
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Details
    cards:
      - type: entities
        title: WAN Details
        entities:
          - entity: binary_sensor.hgw5_wan_status
            name: Status
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: link_type
            name: Link Type
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_ipaddress
            name: WAN IP
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_ipv6address
            name: WAN IPv6
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wired clients
            name: Wired Clients
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wireless clients
            name: Wireless Clients

      - type: entities
        title: Counters
        entities:
          - entity: sensor.hgw5_callers
            name: Total Calls

  # --------------------------------------------------------------------------
  # Section 9: DSL Line Quality
  # --------------------------------------------------------------------------
  - type: grid
    title: DSL Line Quality
    cards:
      - type: entities
        entities:
          - entity: sensor.hgw5_xdsl_download
            name: Download Rate
          - type: attribute
            entity: sensor.hgw5_xdsl_download
            attribute: downstream_maxrate
            name: Max Download Rate
            suffix: " kbit/s"
          - type: attribute
            entity: sensor.hgw5_xdsl_download
            attribute: downstream_noisemargin
            name: Noise Margin (Down)
            suffix: " dB"
          - type: attribute
            entity: sensor.hgw5_xdsl_download
            attribute: downstream_lineattenuation
            name: Line Attenuation (Down)
            suffix: " dB"
          - entity: sensor.hgw5_xdsl_upload
            name: Upload Rate
          - type: attribute
            entity: sensor.hgw5_xdsl_upload
            attribute: upstream_noisemargin
            name: Noise Margin (Up)
            suffix: " dB"

  # --------------------------------------------------------------------------
  # Section 10: Fiber Optics Details
  # --------------------------------------------------------------------------
  - type: grid
    title: Fiber Optics
    cards:
      - type: entities
        entities:
          - entity: sensor.hgw5_fiber_power_rx
            name: RX Power
          - entity: sensor.hgw5_fiber_power_tx
            name: TX Power
          - type: attribute
            entity: sensor.hgw5_fiber_power_rx
            attribute: Temperature
            name: Module Temperature
            suffix: " C"
          - type: attribute
            entity: sensor.hgw5_fiber_power_rx
            attribute: Voltage
            name: Module Voltage
            suffix: " V"
          - type: attribute
            entity: sensor.hgw5_fiber_power_rx
            attribute: ONU State
            name: ONU State

  # --------------------------------------------------------------------------
  # Section 11: Connected Devices
  # --------------------------------------------------------------------------
  - type: grid
    title: Details
    cards:
      - type: conditional
        conditions:
          - entity: binary_sensor.hgw5_call_missed
            state: "on"
        card:
          type: markdown
          title: Missed Calls
          content: >
            {% for call in state_attr('binary_sensor.hgw5_call_missed', 'missed_calls') or [] %}
            - **{{ call.phone_number }}** at {{ call.date }}
            {% endfor %}

      - type: markdown
        title: Connected Devices
        content: >
          | Device | IP | Connection | Signal |
          |--------|----|------------|--------|
          {% for state in states.device_tracker
            if state.attributes.get('source_type') == 'router'
            and state.state == 'home' %}
          | {{ state.name }} | {{ state.attributes.ip_address | default('-') }} | {{ state.attributes.connection | default('?') }} {{ state.attributes.band | default('') }} | {{ state.attributes.signal_quality | default('-') }} |
          {% endfor %}
