##############################################################################
# SoftAtHome Gateway - Home Assistant Dashboard
##############################################################################

title: Livebox
path: livebox
type: sections
sections:

  # --------------------------------------------------------------------------
  # Section 1: Status & Controls
  # --------------------------------------------------------------------------
  - type: grid
    title: Status & Controls
    cards:
      - type: entities
        title: WAN Connection
        entities:
          - entity: binary_sensor.hgw5_wan_status
            name: Status
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: link_type
            name: Link Type
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: link_state
            name: Link State
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_ipaddress
            name: WAN IP
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_gw
            name: Gateway
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wired clients
            name: Wired Clients
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wireless clients
            name: Wireless Clients
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: uptime
            name: Uptime Since

      - type: entities
        title: System
        entities:
          - entity: sensor.hgw5_reboots
            name: Total Reboots
          - entity: sensor.hgw5_uptime
            name: Uptime
          - entity: binary_sensor.hgw5_remote_access
            name: Remote Access
          - entity: binary_sensor.hgw5_dynamic_dns_no_ip
            name: Dynamic DNS

      - type: tile
        entity: button.hgw5_livebox_restart
        name: Restart Gateway
        color: red
        tap_action:
          action: toggle
          confirmation:
            text: Are you sure you want to restart the gateway?

  # --------------------------------------------------------------------------
  # Section 2: WiFi
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi
    cards:
      - type: tile
        entity: switch.hgw5_wifi
        name: WiFi
        color: blue

      - type: tile
        entity: switch.hgw5_guest_wifi
        name: Guest WiFi
        color: purple

      - type: tile
        entity: switch.hgw5_wifi_2_4_ghz
        name: 2.4 GHz
        color: cyan

      - type: tile
        entity: switch.hgw5_wifi_5_ghz
        name: 5 GHz
        color: teal

      - type: tile
        entity: switch.hgw5_wps
        name: WPS
        color: amber

      - type: entity
        entity: sensor.hgw5_guest_wifi_bandwidth_limit
        name: Guest Bandwidth Limit

      - type: entities
        title: "2.4 GHz Radio"
        entities:
          - entity: sensor.hgw5_wifi_2_4ghz_channel
            name: Channel
          - entity: sensor.hgw5_wifi_2_4ghz_clients
            name: Clients
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: standard
            name: Standard
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: max_bitrate_mbps
            name: Max Bitrate
            suffix: " Mbps"

      - type: entities
        title: "5 GHz Radio"
        entities:
          - entity: sensor.hgw5_wifi_5ghz_channel
            name: Channel
          - entity: sensor.hgw5_wifi_5ghz_clients
            name: Clients
          - type: attribute
            entity: sensor.hgw5_wifi_5ghz_channel
            attribute: standard
            name: Standard
          - type: attribute
            entity: sensor.hgw5_wifi_5ghz_channel
            attribute: max_bitrate_mbps
            name: Max Bitrate
            suffix: " Mbps"

  # --------------------------------------------------------------------------
  # Section 3: Network
  # --------------------------------------------------------------------------
  - type: grid
    title: Network
    cards:
      - type: entities
        title: Ethernet Ports
        entities:
          - entity: sensor.hgw5_eth1_link_speed
            name: ETH1
          - entity: sensor.hgw5_eth2_link_speed
            name: ETH2
          - entity: sensor.hgw5_eth3_link_speed
            name: ETH3
          - entity: sensor.hgw5_eth4_link_speed
            name: ETH4

      - type: entities
        title: Counters
        entities:
          - entity: sensor.hgw5_callers
            name: Total Calls
          - entity: sensor.hgw5_static_dhcp_leases
            name: Static DHCP Leases
          - entity: sensor.hgw5_ports_forwarding
            name: Port Forwarding Rules
          - entity: sensor.hgw5_dhcp_leases
            name: DHCP Leases

      - type: markdown
        title: Static DHCP Leases
        content: "| Name | MAC | IP |\n|------|-----|-----------|{%- for lease in state_attr('sensor.hgw5_static_dhcp_leases', 'Leases') or [] %}\n| {{ lease['Name'] | default('', true) }} | {{ lease['MAC Address'] }} | {{ lease['IP Address'] }} |{%- endfor %}"

      - type: markdown
        title: Port Forwarding
        content: "| Rule | Destination | WAN Port | Port |\n|------|------------|----------|------|{%- for rule in state_attr('sensor.hgw5_ports_forwarding', 'Ports') or [] %}\n| {{ rule['id'] }} | {{ rule['WAN Ip'] }} | {{ rule['WAN Port'] }} | {{ rule['Port'] }} |{%- endfor %}"

  # --------------------------------------------------------------------------
  # Section 4: Actions
  # --------------------------------------------------------------------------
  - type: grid
    title: Actions
    columns: 3
    cards:
      - type: button
        name: WiFi On
        icon: mdi:wifi
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_wifi

      - type: button
        name: WiFi Off
        icon: mdi:wifi-off
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_wifi
          confirmation:
            text: "Disable WiFi?"

      - type: button
        name: Guest WiFi On
        icon: mdi:wifi-lock-open
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_guest_wifi

      - type: button
        name: Guest WiFi Off
        icon: mdi:wifi-lock
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_guest_wifi
          confirmation:
            text: "Disable Guest WiFi?"

      - type: button
        name: All WiFi Off
        icon: mdi:wifi-cancel
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi
          confirmation:
            text: "Disable ALL WiFi?"

      - type: button
        name: All WiFi On
        icon: mdi:wifi-check
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi

      - type: button
        name: Add Static DHCP
        icon: mdi:ip-network
        tap_action:
          action: perform-action
          perform_action: livebox.add_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            ip_address: "192.168.1.100"
          confirmation:
            text: "Add static DHCP lease?"

      - type: button
        name: Remove Static DHCP
        icon: mdi:ip-network-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
          confirmation:
            text: "Remove static DHCP lease?"

      - type: button
        name: Add Port Forward
        icon: mdi:arrow-right-bold-box
        tap_action:
          action: perform-action
          perform_action: livebox.add_port_forwarding
          data:
            description: "Web Server"
            destination_ip_address: "192.168.1.100"
            internal_port: 8080
            external_port: 80
            protocol: tcp
            enable: true
          confirmation:
            text: "Add port forwarding rule?"

      - type: button
        name: Remove Port Forward
        icon: mdi:arrow-right-bold-box-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_port_forwarding
          data:
            id: "Web Server"
            destination_ip_address: "192.168.1.100"
          confirmation:
            text: "Remove port forwarding rule?"

      - type: button
        name: Rename Device
        icon: mdi:rename
        tap_action:
          action: perform-action
          perform_action: livebox.rename_device
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            name: "Living Room TV"
          confirmation:
            text: "Rename this device?"

      - type: button
        name: Clear Missed Calls
        icon: mdi:phone-missed
        tap_action:
          action: perform-action
          perform_action: livebox.remove_call_missed
          confirmation:
            text: "Clear all missed calls?"

  # --------------------------------------------------------------------------
  # Section 5: Phone
  # --------------------------------------------------------------------------
  - type: grid
    title: Phone
    cards:
      - type: tile
        entity: binary_sensor.hgw5_call_missed
        name: Missed Calls
        color: red

      - type: tile
        entity: button.hgw5_ring_your_phone
        name: Ring Phone

      - type: tile
        entity: button.hgw5_clear_calls
        name: Clear Calls

