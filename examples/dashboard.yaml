##############################################################################
# Orange Livebox - Home Assistant Dashboard Examples
#
# Replace "livebox_7" in entity IDs with your actual device name
# (e.g. livebox_6, livebox_fibre, etc.)
#
# To find your entity IDs: Developer Tools > States > filter "livebox"
##############################################################################

# ============================================================================
# FULL DASHBOARD VIEW
# ============================================================================
title: Livebox
path: livebox
type: sections
sections:

  # --------------------------------------------------------------------------
  # Section 1: Network Status Overview
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Status
    cards:
      # WAN connectivity with details
      - type: tile
        entity: binary_sensor.livebox_7_wan_status
        name: WAN
        color: green

      # Uptime
      - type: entity
        entity: sensor.livebox_7_uptime
        name: Uptime

      # Remote access warning
      - type: tile
        entity: binary_sensor.livebox_7_remote_access
        name: Remote Access
        color: red

      # Restart button
      - type: tile
        entity: button.livebox_7_livebox_restart
        name: Restart
        color: red
        tap_action:
          action: toggle
          confirmation:
            text: Are you sure you want to restart the Livebox?

  # --------------------------------------------------------------------------
  # Section 2: WiFi Controls
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi Controls
    cards:
      - type: tile
        entity: switch.livebox_7_wifi
        name: WiFi
        color: blue

      - type: tile
        entity: switch.livebox_7_guest_wifi
        name: Guest WiFi
        color: purple

      - type: tile
        entity: switch.livebox_7_wifi_2_4_ghz
        name: 2.4 GHz
        color: cyan

      - type: tile
        entity: switch.livebox_7_wifi_5_ghz
        name: 5 GHz
        color: teal

      # Only on Livebox 7
      - type: tile
        entity: switch.livebox_7_wifi_6_ghz
        name: 6 GHz
        color: indigo

      - type: tile
        entity: switch.livebox_7_wps
        name: WPS
        color: amber

  # --------------------------------------------------------------------------
  # Section 2b: Service Buttons
  # --------------------------------------------------------------------------
  - type: grid
    title: Actions
    columns: 3
    cards:
      # --- WiFi Controls ---
      - type: button
        name: WiFi On
        icon: mdi:wifi
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.livebox_7_wifi

      - type: button
        name: WiFi Off
        icon: mdi:wifi-off
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.livebox_7_wifi
          confirmation:
            text: "Disable WiFi?"

      - type: button
        name: Guest WiFi On
        icon: mdi:wifi-lock-open
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.livebox_7_guest_wifi

      - type: button
        name: Guest WiFi Off
        icon: mdi:wifi-lock
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.livebox_7_guest_wifi
          confirmation:
            text: "Disable Guest WiFi?"

      - type: button
        name: All WiFi Off
        icon: mdi:wifi-cancel
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id:
              - switch.livebox_7_wifi
              - switch.livebox_7_guest_wifi
          confirmation:
            text: "Disable ALL WiFi networks?"

      - type: button
        name: All WiFi On
        icon: mdi:wifi-check
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id:
              - switch.livebox_7_wifi
              - switch.livebox_7_guest_wifi

      # --- DHCP Management ---
      - type: button
        name: Add Static DHCP
        icon: mdi:ip-network
        tap_action:
          action: perform-action
          perform_action: livebox.add_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            ip_address: "192.168.1.100"
          confirmation:
            text: "Add static DHCP lease?"

      - type: button
        name: Remove Static DHCP
        icon: mdi:ip-network-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
          confirmation:
            text: "Remove static DHCP lease?"

      # --- Port Forwarding ---
      - type: button
        name: Add Port Forward
        icon: mdi:arrow-right-bold-box
        tap_action:
          action: perform-action
          perform_action: livebox.add_port_forwarding
          data:
            description: "Web Server"
            destination_ip_address: "192.168.1.100"
            internal_port: 8080
            external_port: 80
            protocol: tcp
            enable: true
          confirmation:
            text: "Add port forwarding rule?"

      - type: button
        name: Remove Port Forward
        icon: mdi:arrow-right-bold-box-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_port_forwarding
          data:
            id: "Web Server"
            destination_ip_address: "192.168.1.100"
          confirmation:
            text: "Remove port forwarding rule?"

      # --- Device Management ---
      - type: button
        name: Rename Device
        icon: mdi:rename
        tap_action:
          action: perform-action
          perform_action: livebox.rename_device
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            name: "Living Room TV"
          confirmation:
            text: "Rename this device?"

      # --- Call Management ---
      - type: button
        name: Clear Missed Calls
        icon: mdi:phone-missed
        tap_action:
          action: perform-action
          perform_action: livebox.remove_call_missed
          confirmation:
            text: "Clear all missed calls?"

  # --------------------------------------------------------------------------
  # Section 3: Connection Speeds (DSL)
  # --------------------------------------------------------------------------
  - type: grid
    title: Connection Speed
    cards:
      - type: gauge
        entity: sensor.livebox_7_xdsl_download
        name: Download
        min: 0
        max: 1000
        severity:
          green: 100
          yellow: 30
          red: 0
        needle: true

      - type: gauge
        entity: sensor.livebox_7_xdsl_upload
        name: Upload
        min: 0
        max: 300
        severity:
          green: 30
          yellow: 10
          red: 0
        needle: true

  # --------------------------------------------------------------------------
  # Section 3 (alt): Connection Speeds (Fiber)
  # --------------------------------------------------------------------------
  - type: grid
    title: Fiber Signal
    cards:
      - type: gauge
        entity: sensor.livebox_7_fiber_power_rx
        name: Fiber RX Power
        unit: dBm
        min: -30
        max: 0
        severity:
          green: -20
          yellow: -25
          red: -30
        needle: true

      - type: gauge
        entity: sensor.livebox_7_fiber_power_tx
        name: Fiber TX Power
        unit: dBm
        min: -10
        max: 10
        severity:
          green: 0
          yellow: -5
          red: -10
        needle: true

  # --------------------------------------------------------------------------
  # Section 4: Traffic History
  # --------------------------------------------------------------------------
  - type: grid
    title: Traffic
    cards:
      - type: statistics-graph
        entities:
          - entity: sensor.livebox_7_fiber_rx
            name: Download
          - entity: sensor.livebox_7_fiber_tx
            name: Upload
        days_to_show: 7
        stat_types:
          - change
        chart_type: bar
        period: day
        title: Daily Traffic

      - type: history-graph
        entities:
          - entity: sensor.livebox_7_wifi_rx
            name: WiFi RX
          - entity: sensor.livebox_7_wifi_tx
            name: WiFi TX
        hours_to_show: 24
        title: WiFi Traffic (24h)

  # --------------------------------------------------------------------------
  # Section 5: Phone & Calls
  # --------------------------------------------------------------------------
  - type: grid
    title: Phone
    cards:
      - type: tile
        entity: binary_sensor.livebox_7_call_missed
        name: Missed Calls
        color: red

      - type: tile
        entity: button.livebox_7_ring_your_phone
        name: Ring Phone

      - type: tile
        entity: button.livebox_7_clear_calls
        name: Clear Calls

      - type: calendar
        entities:
          - entity: calendar.livebox_7_call_log
        initial_view: listWeek
        title: Call Log

  # --------------------------------------------------------------------------
  # Section 6: Network Info
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Details
    cards:
      - type: entity
        entity: sensor.livebox_7_callers
        name: Total Calls

      - type: entity
        entity: sensor.livebox_7_ports_forwarding
        name: Port Forwarding Rules

      - type: entity
        entity: sensor.livebox_7_dhcp_leases
        name: DHCP Leases

      - type: entity
        entity: sensor.livebox_7_guest_dhcp_leases
        name: Guest Leases


# ============================================================================
# INDIVIDUAL CARD EXAMPLES (copy what you need)
# ============================================================================

# --- WAN Status with all attributes ---
- type: entities
  title: WAN Details
  entities:
    - entity: binary_sensor.livebox_7_wan_status
      name: Status
    - type: attribute
      entity: binary_sensor.livebox_7_wan_status
      attribute: link_type
      name: Link Type
    - type: attribute
      entity: binary_sensor.livebox_7_wan_status
      attribute: wan_ipaddress
      name: WAN IP
    - type: attribute
      entity: binary_sensor.livebox_7_wan_status
      attribute: wan_ipv6address
      name: WAN IPv6
    - type: attribute
      entity: binary_sensor.livebox_7_wan_status
      attribute: wired clients
      name: Wired Clients
    - type: attribute
      entity: binary_sensor.livebox_7_wan_status
      attribute: wireless clients
      name: Wireless Clients


# --- DSL Details with line quality attributes ---
- type: entities
  title: DSL Line Quality
  entities:
    - entity: sensor.livebox_7_xdsl_download
      name: Download Rate
    - type: attribute
      entity: sensor.livebox_7_xdsl_download
      attribute: downstream_maxrate
      name: Max Download Rate
      suffix: " kbit/s"
    - type: attribute
      entity: sensor.livebox_7_xdsl_download
      attribute: downstream_noisemargin
      name: Noise Margin (Down)
      suffix: " dB"
    - type: attribute
      entity: sensor.livebox_7_xdsl_download
      attribute: downstream_lineattenuation
      name: Line Attenuation (Down)
      suffix: " dB"
    - entity: sensor.livebox_7_xdsl_upload
      name: Upload Rate
    - type: attribute
      entity: sensor.livebox_7_xdsl_upload
      attribute: upstream_noisemargin
      name: Noise Margin (Up)
      suffix: " dB"


# --- Fiber Optics Details ---
- type: entities
  title: Fiber Optics
  entities:
    - entity: sensor.livebox_7_fiber_power_rx
      name: RX Power
    - entity: sensor.livebox_7_fiber_power_tx
      name: TX Power
    - type: attribute
      entity: sensor.livebox_7_fiber_power_rx
      attribute: Temperature
      name: Module Temperature
      suffix: " C"
    - type: attribute
      entity: sensor.livebox_7_fiber_power_rx
      attribute: Voltage
      name: Module Voltage
      suffix: " V"
    - type: attribute
      entity: sensor.livebox_7_fiber_power_rx
      attribute: ONU State
      name: ONU State


# --- DHCP Leases Table (Markdown) ---
- type: markdown
  title: DHCP Leases
  content: >
    | Name | IP Address | MAC |
    |------|-----------|-----|
    {% for lease in state_attr('sensor.livebox_7_dhcp_leases', 'Leases') or [] %}
    | {{ lease['Name'] }} | {{ lease['IP Address'] }} | {{ lease['Mac Address'] }} |
    {% endfor %}


# --- Port Forwarding Table (Markdown) ---
- type: markdown
  title: Port Forwarding
  content: >
    | ID | WAN IP | WAN Port | Internal Port |
    |----|--------|----------|---------------|
    {% for rule in state_attr('sensor.livebox_7_ports_forwarding', 'Ports') or [] %}
    | {{ rule['id'] }} | {{ rule['WAN Ip'] }} | {{ rule['WAN Port'] }} | {{ rule['Port'] }} |
    {% endfor %}


# --- Missed Calls List (Markdown + Conditional) ---
- type: conditional
  conditions:
    - entity: binary_sensor.livebox_7_call_missed
      state: "on"
  card:
    type: markdown
    title: Missed Calls
    content: >
      {% for call in state_attr('binary_sensor.livebox_7_call_missed', 'missed_calls') or [] %}
      - **{{ call.phone_number }}** at {{ call.date }}
      {% endfor %}


# --- Connected Devices with Signal Quality (Markdown) ---
- type: markdown
  title: Connected Devices
  content: >
    | Device | IP | Connection | Signal |
    |--------|----|------------|--------|
    {% for state in states.device_tracker
      if state.attributes.get('source_type') == 'router'
      and 'livebox' in state.entity_id
      and state.state == 'home' %}
    | {{ state.name }} | {{ state.attributes.ip_address }} | {{ state.attributes.connection | default('?') }} {{ state.attributes.band | default('') }} | {{ state.attributes.signal_quality | default('-') }} |
    {% endfor %}


# ============================================================================
# !! CUSTOM CARDS BELOW - REQUIRE HACS INSTALLATION !!
# Everything above this line uses only built-in HA cards.
# ============================================================================


# ============================================================================
# MUSHROOM CARDS
# REQUIRES HACS: https://github.com/piitaya/lovelace-mushroom
# ============================================================================

# --- Compact WiFi chips row ---
- type: horizontal-stack
  cards:
    - type: custom:mushroom-chips-card
      chips:
        - type: entity
          entity: switch.livebox_7_wifi
          icon: mdi:wifi
          tap_action:
            action: toggle
        - type: entity
          entity: switch.livebox_7_guest_wifi
          icon: mdi:wifi-lock-open
          tap_action:
            action: toggle
        - type: entity
          entity: switch.livebox_7_wifi_2_4_ghz
          content: 2.4G
          tap_action:
            action: toggle
        - type: entity
          entity: switch.livebox_7_wifi_5_ghz
          content: 5G
          tap_action:
            action: toggle
        - type: entity
          entity: switch.livebox_7_wps
          icon: mdi:wifi-settings
          tap_action:
            action: toggle


# --- Mushroom tile for WAN with sub-info ---
- type: custom:mushroom-entity-card
  entity: binary_sensor.livebox_7_wan_status
  name: Internet Connection
  icon: mdi:wan
  secondary_info: last-updated
  layout: horizontal


# ============================================================================
# MINI GRAPH CARD
# REQUIRES HACS: https://github.com/kalkih/mini-graph-card
# ============================================================================

# --- Sparkline traffic graph ---
- type: custom:mini-graph-card
  name: Network Traffic
  entities:
    - entity: sensor.livebox_7_fiber_rx
      name: Download
      color: "#4CAF50"
    - entity: sensor.livebox_7_fiber_tx
      name: Upload
      color: "#2196F3"
  hours_to_show: 24
  points_per_hour: 2
  line_width: 2
  show:
    labels: true
    points: false


# ============================================================================
# AUTO ENTITIES
# REQUIRES HACS: https://github.com/thomasloven/lovelace-auto-entities
# ============================================================================

# --- Auto-list all connected devices ---
- type: custom:auto-entities
  card:
    type: entities
    title: Connected Devices
    show_header_toggle: false
  filter:
    include:
      - domain: device_tracker
        integration: livebox
        state: home
    exclude: []
  sort:
    method: name


# --- Auto-list all device WAN access switches ---
- type: custom:auto-entities
  card:
    type: entities
    title: Device Internet Access
    show_header_toggle: false
  filter:
    include:
      - domain: switch
        integration: livebox
        entity_id: "*wan_access"
  sort:
    method: name


