##############################################################################
# Orange Livebox - Home Assistant Dashboard
#
# Entity IDs use your Livebox's ProductClass as prefix (e.g. "hgw5",
# "livebox_7", "livebox_fibre"). To find yours:
#   Developer Tools > States > filter "livebox" or your product name
#
# Some sensors are DISABLED by default and must be enabled first:
#   Settings > Devices > Livebox > Entities > (enable the greyed-out ones)
#   - Uptime, WiFi Rx/Tx, DHCP Leases, Guest DHCP Leases, Ports Forwarding
#
# Per-band WiFi switches (2.4/5/6 GHz) only appear if your Livebox
# reports WLAN VAP data. If missing, use the main WiFi switch instead.
#
# This file is a complete dashboard view. Paste it into a manual dashboard
# via Settings > Dashboards > Add Dashboard > (three dots) > Edit in YAML.
#
# For individual card snippets and HACS examples, see cards.yaml
# For automation examples, see automations.yaml
##############################################################################

title: Livebox
path: livebox
type: sections
sections:

  # --------------------------------------------------------------------------
  # Section 1: Network Status Overview
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Status
    cards:
      - type: entities
        title: WAN Connection
        entities:
          - entity: binary_sensor.hgw5_wan_status
            name: Status
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: link_type
            name: Link Type
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: link_state
            name: Link State
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_ipaddress
            name: WAN IP
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_gw
            name: Gateway
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wan_ipv6address
            name: WAN IPv6
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wired clients
            name: Wired Clients
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: wireless clients
            name: Wireless Clients
          - type: attribute
            entity: binary_sensor.hgw5_wan_status
            attribute: uptime
            name: Uptime Since

      - type: entities
        title: System
        entities:
          - entity: sensor.hgw5_reboots
            name: Total Reboots
          - entity: binary_sensor.hgw5_remote_access
            name: Remote Access
          - entity: binary_sensor.hgw5_dynamic_dns_no_ip
            name: Dynamic DNS

      - type: tile
        entity: button.hgw5_livebox_restart
        name: Restart Livebox
        color: red
        tap_action:
          action: toggle
          confirmation:
            text: Are you sure you want to restart the Livebox?

  # --------------------------------------------------------------------------
  # Section 2: WiFi Controls
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi Controls
    cards:
      - type: tile
        entity: switch.hgw5_wifi
        name: WiFi
        color: blue

      - type: tile
        entity: switch.hgw5_guest_wifi
        name: Guest WiFi
        color: purple

      - type: tile
        entity: switch.hgw5_wifi_2_4_ghz
        name: 2.4 GHz
        color: cyan

      - type: tile
        entity: switch.hgw5_wifi_5_ghz
        name: 5 GHz
        color: teal

      - type: tile
        entity: switch.hgw5_wps
        name: WPS
        color: amber

  # --------------------------------------------------------------------------
  # Section 3: WiFi Radio Details
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi Radios
    cards:
      - type: entities
        title: "2.4 GHz Radio"
        entities:
          - entity: sensor.hgw5_wifi_2_4ghz_channel
            name: Channel
          - entity: sensor.hgw5_wifi_2_4ghz_clients
            name: Connected Clients
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: standard
            name: Standard
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: max_bitrate_mbps
            name: Max Bitrate
            suffix: " Mbps"
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: bandwidth
            name: Channel Bandwidth
          - type: attribute
            entity: sensor.hgw5_wifi_2_4ghz_channel
            attribute: auto_channel
            name: Auto Channel

      - type: entities
        title: "5 GHz Radio"
        entities:
          - entity: sensor.hgw5_wifi_5ghz_channel
            name: Channel
          - entity: sensor.hgw5_wifi_5ghz_clients
            name: Connected Clients
          - type: attribute
            entity: sensor.hgw5_wifi_5ghz_channel
            attribute: standard
            name: Standard
          - type: attribute
            entity: sensor.hgw5_wifi_5ghz_channel
            attribute: max_bitrate_mbps
            name: Max Bitrate
            suffix: " Mbps"
          - type: attribute
            entity: sensor.hgw5_wifi_5ghz_channel
            attribute: bandwidth
            name: Channel Bandwidth

  # --------------------------------------------------------------------------
  # Section 4: Ethernet Ports
  # --------------------------------------------------------------------------
  - type: grid
    title: Ethernet Ports
    cards:
      - type: entities
        entities:
          - entity: sensor.hgw5_eth1_link_speed
            name: ETH1
          - entity: sensor.hgw5_eth2_link_speed
            name: ETH2
          - entity: sensor.hgw5_eth3_link_speed
            name: ETH3
          - entity: sensor.hgw5_eth4_link_speed
            name: ETH4

  # --------------------------------------------------------------------------
  # Section 5: Guest WiFi Details
  # --------------------------------------------------------------------------
  - type: grid
    title: Guest WiFi
    cards:
      - type: entity
        entity: sensor.hgw5_guest_wifi_bandwidth_limit
        name: Bandwidth Limit

  # --------------------------------------------------------------------------
  # Section 6: Action Buttons
  # --------------------------------------------------------------------------
  - type: grid
    title: WiFi Actions
    columns: 3
    cards:
      - type: button
        name: WiFi On
        icon: mdi:wifi
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_wifi

      - type: button
        name: WiFi Off
        icon: mdi:wifi-off
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_wifi
          confirmation:
            text: "Disable WiFi?"

      - type: button
        name: Guest WiFi On
        icon: mdi:wifi-lock-open
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.hgw5_guest_wifi

      - type: button
        name: Guest WiFi Off
        icon: mdi:wifi-lock
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.hgw5_guest_wifi
          confirmation:
            text: "Disable Guest WiFi?"

      - type: button
        name: All WiFi Off
        icon: mdi:wifi-cancel
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi
          confirmation:
            text: "Disable ALL WiFi networks?"

      - type: button
        name: All WiFi On
        icon: mdi:wifi-check
        icon_height: 40px
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id:
              - switch.hgw5_wifi
              - switch.hgw5_guest_wifi

  # --------------------------------------------------------------------------
  # Section 7: Network Management
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Management
    columns: 3
    cards:
      - type: button
        name: Add Static DHCP
        icon: mdi:ip-network
        tap_action:
          action: perform-action
          perform_action: livebox.add_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            ip_address: "192.168.1.100"
          confirmation:
            text: "Add static DHCP lease?"

      - type: button
        name: Remove Static DHCP
        icon: mdi:ip-network-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_static_dhcp
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
          confirmation:
            text: "Remove static DHCP lease?"

      - type: button
        name: Add Port Forward
        icon: mdi:arrow-right-bold-box
        tap_action:
          action: perform-action
          perform_action: livebox.add_port_forwarding
          data:
            description: "Web Server"
            destination_ip_address: "192.168.1.100"
            internal_port: 8080
            external_port: 80
            protocol: tcp
            enable: true
          confirmation:
            text: "Add port forwarding rule?"

      - type: button
        name: Remove Port Forward
        icon: mdi:arrow-right-bold-box-outline
        tap_action:
          action: perform-action
          perform_action: livebox.remove_port_forwarding
          data:
            id: "Web Server"
            destination_ip_address: "192.168.1.100"
          confirmation:
            text: "Remove port forwarding rule?"

      - type: button
        name: Rename Device
        icon: mdi:rename
        tap_action:
          action: perform-action
          perform_action: livebox.rename_device
          data:
            mac_address: "AA:BB:CC:DD:EE:FF"
            name: "Living Room TV"
          confirmation:
            text: "Rename this device?"

      - type: button
        name: Clear Missed Calls
        icon: mdi:phone-missed
        tap_action:
          action: perform-action
          perform_action: livebox.remove_call_missed
          confirmation:
            text: "Clear all missed calls?"

  # --------------------------------------------------------------------------
  # Section 8: DHCP & Port Forwarding
  # --------------------------------------------------------------------------
  - type: grid
    title: Network Info
    cards:
      - type: entities
        title: Counters
        entities:
          - entity: sensor.hgw5_callers
            name: Total Calls
          - entity: sensor.hgw5_static_dhcp_leases
            name: Static DHCP Leases
          - entity: sensor.hgw5_ports_forwarding
            name: Port Forwarding Rules
          - entity: sensor.hgw5_dhcp_leases
            name: DHCP Leases
          - entity: sensor.hgw5_uptime
            name: Uptime

      - type: markdown
        title: Port Forwarding
        content: "| Rule | Destination | WAN Port | Internal Port |\n|------|------------|----------|---------------|{%- for rule in state_attr('sensor.hgw5_ports_forwarding', 'Ports') or [] %}\n| {{ rule['id'] }} | {{ rule['WAN Ip'] }} | {{ rule['WAN Port'] }} | {{ rule['Port'] }} |{%- endfor %}"

      - type: markdown
        title: Static DHCP Leases
        content: "| Name | MAC | IP Address |\n|------|-----|-----------|{%- for lease in state_attr('sensor.hgw5_static_dhcp_leases', 'Leases') or [] %}\n| {{ lease['Name'] | default('', true) }} | {{ lease['MAC Address'] }} | {{ lease['IP Address'] }} |{%- endfor %}"

  # --------------------------------------------------------------------------
  # Section 9: Phone & Calls
  # --------------------------------------------------------------------------
  - type: grid
    title: Phone
    cards:
      - type: tile
        entity: binary_sensor.hgw5_call_missed
        name: Missed Calls
        color: red

      - type: tile
        entity: button.hgw5_ring_your_phone
        name: Ring Phone

      - type: tile
        entity: button.hgw5_clear_calls
        name: Clear Calls

      - type: calendar
        entities:
          - calendar.hgw5_call_log
        initial_view: dayGridMonth

  # --------------------------------------------------------------------------
  # Section 10: Connected Devices
  # --------------------------------------------------------------------------
  - type: grid
    title: Connected Devices
    cards:
      - type: conditional
        conditions:
          - entity: binary_sensor.hgw5_call_missed
            state: "on"
        card:
          type: markdown
          title: Missed Calls
          content: "{%- for call in state_attr('binary_sensor.hgw5_call_missed', 'missed_calls') or [] %}\n- **{{ call.phone_number }}** at {{ call.date }}\n{%- endfor %}"

      - type: markdown
        title: Devices on Network
        content: "| Device | IP | Connection | Signal |\n|--------|----|------------|--------|{%- for state in states.device_tracker if state.attributes.get('source_type') == 'router' and state.state == 'home' %}\n| {{ state.name }} | {{ state.attributes.ip_address | default('-', true) }} | {{ state.attributes.connection | default('?', true) }} {{ state.attributes.band | default('', true) }} | {{ state.attributes.signal_quality | default('-', true) }} |{%- endfor %}"
