##############################################################################
# SoftAtHome Gateway - Automation Examples
#
# Add these to your automations.yaml or via Settings > Automations.
# Replace "hgw5" with your actual device name.
##############################################################################

# --- Notify on new missed call ---
- alias: "Gateway -Missed call notification"
  trigger:
    - platform: state
      entity_id: binary_sensor.hgw5_call_missed
      to: "on"
  action:
    - action: notify.mobile_app
      data:
        title: "Missed Call"
        message: >
          Missed call from {{ state_attr('binary_sensor.hgw5_call_missed',
          'missed_calls')[0].phone_number }}

# --- Disable WPS at night for security ---
- alias: "Gateway -Disable WPS at night"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.hgw5_wps

# --- Alert on remote access enabled ---
- alias: "Gateway -Remote access alert"
  trigger:
    - platform: state
      entity_id: binary_sensor.hgw5_remote_access
      to: "on"
  action:
    - action: notify.mobile_app
      data:
        title: "Security Alert"
        message: "Remote access has been enabled on your gateway!"

# --- Disable WiFi at night, re-enable in the morning ---
- alias: "Gateway -WiFi off at midnight"
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.hgw5_wifi

- alias: "Gateway -WiFi on at 7am"
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - action: switch.turn_on
      target:
        entity_id: switch.hgw5_wifi

# --- Disable guest WiFi when nobody is home ---
- alias: "Gateway -Guest WiFi off when away"
  trigger:
    - platform: state
      entity_id: zone.home
      to: "0"
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.hgw5_guest_wifi

- alias: "Gateway -Guest WiFi on when home"
  trigger:
    - platform: state
      entity_id: zone.home
      from: "0"
  action:
    - action: switch.turn_on
      target:
        entity_id: switch.hgw5_guest_wifi

# --- Turn off 5GHz at night to save power, keep 2.4GHz for IoT devices ---
- alias: "Gateway -5GHz off at night"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - action: switch.turn_off
      target:
        entity_id:
          - switch.hgw5_wifi_5_ghz
          - switch.hgw5_wifi_6_ghz

- alias: "Gateway -5GHz on in the morning"
  trigger:
    - platform: time
      at: "06:30:00"
  action:
    - action: switch.turn_on
      target:
        entity_id:
          - switch.hgw5_wifi_5_ghz
          - switch.hgw5_wifi_6_ghz

# --- Toggle WiFi via a button press (e.g. Zigbee button) ---
- alias: "Gateway -Toggle WiFi with button"
  trigger:
    - platform: event
      event_type: zha_event
      event_data:
        device_id: "your_button_device_id"
        command: "toggle"
  action:
    - action: switch.toggle
      target:
        entity_id: switch.hgw5_wifi

# --- Block a kid's device from internet at bedtime ---
- alias: "Gateway -Block kid tablet at bedtime"
  trigger:
    - platform: time
      at: "21:00:00"
  condition:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - sun
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.kids_tablet_wan_access

- alias: "Gateway -Unblock kid tablet in the morning"
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - action: switch.turn_on
      target:
        entity_id: switch.kids_tablet_wan_access
