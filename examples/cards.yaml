##############################################################################
# SoftAtHome Gateway - Custom Card Snippets (require HACS)
#
# These cards require third-party frontend components installed via HACS.
# Copy individual cards into your dashboard's YAML editor.
#
# Replace "hgw5" with your actual device name.
##############################################################################


# ============================================================================
# MUSHROOM CARDS
# REQUIRES HACS: https://github.com/piitaya/lovelace-mushroom
# Install via: HACS > Frontend > Search "Mushroom"
# ============================================================================

# --- Compact WiFi chips row ---
- type: horizontal-stack
  cards:
    - type: custom:mushroom-chips-card
      chips:
        - type: entity
          entity: switch.hgw5_wifi
          icon: mdi:wifi
          tap_action:
            action: toggle
        - type: entity
          entity: switch.hgw5_guest_wifi
          icon: mdi:wifi-lock-open
          tap_action:
            action: toggle
        - type: entity
          entity: switch.hgw5_wifi_2_4_ghz
          content: 2.4G
          tap_action:
            action: toggle
        - type: entity
          entity: switch.hgw5_wifi_5_ghz
          content: 5G
          tap_action:
            action: toggle
        - type: entity
          entity: switch.hgw5_wps
          icon: mdi:wifi-settings
          tap_action:
            action: toggle

# --- Mushroom tile for WAN with sub-info ---
- type: custom:mushroom-entity-card
  entity: binary_sensor.hgw5_wan_status
  name: Internet Connection
  icon: mdi:wan
  secondary_info: last-updated
  layout: horizontal


# ============================================================================
# MINI GRAPH CARD
# REQUIRES HACS: https://github.com/kalkih/mini-graph-card
# Install via: HACS > Frontend > Search "Mini Graph Card"
# ============================================================================

# --- Sparkline traffic graph ---
- type: custom:mini-graph-card
  name: Network Traffic
  entities:
    - entity: sensor.hgw5_fiber_rx
      name: Download
      color: "#4CAF50"
    - entity: sensor.hgw5_fiber_tx
      name: Upload
      color: "#2196F3"
  hours_to_show: 24
  points_per_hour: 2
  line_width: 2
  show:
    labels: true
    points: false


# ============================================================================
# AUTO ENTITIES
# REQUIRES HACS: https://github.com/thomasloven/lovelace-auto-entities
# Install via: HACS > Frontend > Search "Auto Entities"
# ============================================================================

# --- Auto-list all connected devices ---
- type: custom:auto-entities
  card:
    type: entities
    title: Connected Devices
    show_header_toggle: false
  filter:
    include:
      - domain: device_tracker
        integration: livebox
        state: home
    exclude: []
  sort:
    method: name

# --- Auto-list all device WAN access switches ---
- type: custom:auto-entities
  card:
    type: entities
    title: Device Internet Access
    show_header_toggle: false
  filter:
    include:
      - domain: switch
        integration: livebox
        entity_id: "*wan_access"
  sort:
    method: name
